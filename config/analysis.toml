[paths]
dicom_archive = "LIDC-IDRI-StandardizedRepresentation-March2020-manifest.zip"
processed_dir = "data/processed"
results_dir = "results"

[reproducibility]
master_seed = 20260326

[ingestion]
progress_every = 250
strict_source_counts = true

[validation.expected]
patients = 875
annotations = 6859
segmentations = 6859
nodules = 2651
nodules_with_1_or_2_readers = 1259
nodules_with_3_or_4_readers = 1378
nodules_with_more_than_4_readers = 14

[label_case_effects]
minimum_readers = 3
maximum_readers = 4
cross_validation_folds = 5
cross_validation_repetitions = 20
bootstrap_repetitions = 2000
confidence_level = 0.95
random_reader_seed_offset = 1100
partition_seed_offset = 2100
training_reference = "median_exclude_3"
model = "combined_logistic"
primary_references = ["median_3_benign", "median_3_malignant"]
sensitivity_references = ["any_reader_4_or_5", "random_reader"]

[label_case_effects.logistic_regression]
regularisation_c = 1.0
maximum_iterations = 5000
class_weight = "balanced"

[shared_assessment]
minimum_readers = 3
maximum_readers = 4
assignment_repetitions = 20
assignment_seed_offset = 3100
cross_validation_folds = 5
cross_validation_repetitions = 20
partition_seed_offset = 4100
bootstrap_repetitions = 2000
confidence_level = 0.95
model = "combined_logistic"

[publication]
dpi = 600
formats = ["pdf", "svg", "png", "tiff"]
